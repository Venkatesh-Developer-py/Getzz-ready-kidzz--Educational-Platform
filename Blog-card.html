    .card
    {
      background:#fff;
      border:2px solid #fb923c;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 6px 18px rgba(249,115,22,.15);
      transition:.3s;
      height:auto;
      display:flex;
      flex-direction: column;
    }
    .card:hover
    {
      transform:translateY(-6px);
      box-shadow:0 10px 25px rgba(249,115,22,.25)
    }
    .card img
    {
      width:100%;
      height:190px;
      object-fit:cover;
      loading:lazy
    }
    .card-body
    {
      padding:12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 6px;
    }
    .card h3{
      font-size: 16px;
      margin: 6px 0;
      line-height: 1.3;
      color:#9a3412
    }
    .meta
    {
      font-size: 12px;
      color:#4b5563;
      margin-bottom: 6px;
    }
    .meta span
    {
      margin-right:10px
    }
    .views
    {
      display:flex;
      align-items:center;
      font-size: 12px;
      color:#ea580c;
      margin: 6px 0;
      gap:6px
    }
    .fancy-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      background: linear-gradient(135deg, #ff7a00, #ff9a00);
      box-shadow: 0 10px 25px rgba(255, 140, 0, 0.45);
      overflow: hidden;
      transition: all 0.35s ease;
    }

    /* TEXT */
    .fancy-btn span {
      z-index: 2;
    }

    /* ICON CIRCLE */
    .fancy-btn .icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      font-size: 12px;
      transition: all 0.35s ease;
      backdrop-filter: blur(4px);
    }

    /* HOVER MAIN */
    .fancy-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255, 120, 0, 0.6);
    }

    /* ICON MOVE */
    .fancy-btn:hover .icon {
      transform: translateX(8px) scale(1.1);
      background: rgba(255,255,255,0.3);
    }

    /* SHINE EFFECT */
    .fancy-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.6),
        transparent
      );
      transition: 0.6s;
    }

    .fancy-btn:hover::before {
      left: 120%;
    }

    /* INNER GLOW */
    .fancy-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50px;
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.3);
    }

    /* SOFT PULSE (lighter than before) */
    @keyframes softPulse {
      0% { box-shadow: 0 10px 25px rgba(255,140,0,0.4); }
      50% { box-shadow: 0 10px 35px rgba(255,140,0,0.7); }
      100% { box-shadow: 0 10px 25px rgba(255,140,0,0.4); }
    }

    .fancy-btn {
      animation: softPulse 2.5s infinite;
    }
    .card img
    {
      contain:layout strict;
      will-change:transform;
    }
    #blogList>*
    {
      opacity:1;

    }

    <!-- NAVBAR (injected by loader.js) -->

<!-- FOOTER (injected by loader.js) -->
  <div id="footer"></div>
<script type="module">
  import { blogs } from "./blog.js";
  
  // Pre-create fragment for speed
  const fragment = document.createDocumentFragment();
  const list = document.getElementById("blogList");
  
  blogs.forEach(b => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<img src="${b.image}" alt="${b.title}" loading="lazy" width="400" height="190"/>
      <div class="card-body">
        <h3>${b.title}</h3>
        <div class="meta"><span>${b.auther}</span><br/><br/><span>${b.date} • ${b.read}</span></div>
        <div class="views">👁 ${b.views}</div>
        <a class="fancy-btn" href="blog.html?slug=${b.slug}">
          <span>Know More</span>
          <div class="icon">➜➜</div>
        </a>
      </a>
      </div>`;
    fragment.appendChild(div);
  });
  
  // Single DOM write = 3x faster
  list.innerHTML = '';
  list.appendChild(fragment);
</script>
